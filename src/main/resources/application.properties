spring.application.name=springstep1

spring.datasource.url=jdbc:mysql://localhost:3306/startspring1
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto:update
spring.jpa.show-sql=true
# trasforma una richiesta post in delete o put,senza non funzionerebbe
spring.mvc.hiddenmethod.filter.enabled=true
#Start data.sql
spring.jpa.defer-datasource-initialization=true 
#Aspetta che Hibernate abbia creato tutte le tabelle (Dipendenti, Account, Permessi) e solo DOPO esegui il file data.sql".
spring.sql.init.mode=always
#Usando always, forzi Spring a eseguire lo script ogni volta che avvii l'applicazione, a prescindere dal tipo di database che stai usando.