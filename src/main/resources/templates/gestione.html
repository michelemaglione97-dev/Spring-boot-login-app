<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <title>Spring Step 01</title>
  </head>
  <body>
    <span th:if="${msg!=null and pers==null}">
    <h3 th:text="${msg}"></h3>
    </span>
  
 <div id="accordionFiltri">
     <div class="d-flex align-items-center gap-3 mb-3">
        <p class="m-0"><b>Operazioni disponibili:</b></p>
        <a class="btn btn-primary fw-bold" data-bs-toggle="collapse" href="#collapseExample" role="button" aria-expanded="false" aria-controls="collapseExample">
            RICERCA
        </a>
        <button class="btn btn-primary fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapseStipendio">
            FILTRO STIPENDIO 
        </button>
        <button class="btn btn-dark fw-bold" type="button" data-bs-toggle="collapse" data-bs-target="#collapsePermesso">
            FILTRO PERMESSO
        </button>
    </div>

    <div class="collapse" id="collapseExample" data-bs-parent="#accordionFiltri">
        <div class="card card-body">
            <div class="d-flex align-items-center gap-3 flex-wrap">
                <form th:action="@{/ricerca}" th:method="get" class="d-flex align-items-center gap-2">
                    <b class="m-0">CF:</b>
                    <input type="text" name="cf" class="form-control form-control-sm" style="width: 150px;" placeholder="Codice Fiscale..." required>
                    <button class="btn btn-sm btn-success" type="submit">SOURCE</button>
                </form>
                <div class="vr" style="height: 30px;"></div>
                <form th:action="@{/ricercaEmail}" th:method="get" class="d-flex align-items-center gap-2">
                    <b class="m-0">Email:</b>
                    <input type="email" name="email" class="form-control form-control-sm" style="width: 180px;" placeholder="E-mail..." required>
                    <button class="btn btn-sm btn-success" type="submit">SOURCE</button>
                </form>
                <div class="vr" style="height: 30px;"></div>
                <form th:action="@{/ricercaNomeCognome}" th:method="get" class="d-flex align-items-center gap-2">
                    <b class="m-0">Nome:</b>
                    <input type="text" name="nome" class="form-control form-control-sm" style="width: 120px;" placeholder="Nome" required>
                    <b class="m-0">Cognome:</b>
                    <input type="text" name="cognome" class="form-control form-control-sm" style="width: 120px;" placeholder="Cognome" required>
                    <button class="btn btn-sm btn-success" type="submit">SOURCE</button>
                </form>
                <div class="vr" style="height: 30px;"></div>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/sopraMedia}" class="btn btn-sm btn-warning fw-bold shadow-sm">Stipendi Sopra Media</a>
                </div>
                <div class="vr" style="height: 30px;"></div>
                <div class="d-flex align-items-center gap-2">
                    <a th:href="@{/fascia3040}" class="btn btn-sm btn-warning fw-bold shadow-sm">30 - 40 ANNI</a>
                </div>
            </div>
        </div>
    </div>

    <div class="collapse" id="collapseStipendio" data-bs-parent="#accordionFiltri">
        <div class="card card-body">
            <form th:action="@{/ricercaStipendio}" th:method="get" class="d-flex align-items-center gap-2">
                <b class="m-0">Cifra >=</b>
                <input type="number"  name="cifra" class="form-control form-control-sm" style="width: 150px;" placeholder="Es: 1500" required>
                <button class="btn btn-sm btn-success" type="submit">SOURCE</button>
            </form>
        </div>
    </div>
<div class="collapse" id="collapsePermesso" data-bs-parent="#accordionFiltri">
    <div class="card card-body">
        <form th:action="@{/filtraPermesso}" th:method="get" class="d-flex align-items-center gap-2">
            <b class="m-0">Scegli Ruolo:</b>
            <select name="idPermesso" class="form-select form-select-sm" style="width: 200px;" required>
                <option value="" disabled selected>Seleziona...</option>
                <option value="1">ADMIN </option>
                <option value="2">USER </option>
            </select>
            <button class="btn btn-sm btn-success" type="submit">APPLICA</button>
        </form>
    </div>
</div>
 </div>
 
 
 <table class="table table-striped">
  <thead>
    <tr>
      <th scope="col">#</th>
          <th scope="col">Nome</th>
          <th scope="col">Cognome</th>
          <th scope="col">Sesso</th>
          <th scope="col">Codice Fiscale</th>
          <th scope="col">Data Nascita</th>
          <th scope="col" th:if="${mostraEta}" class="text-danger fw-bold text-center">ETÀ </th>
          <th scope="col">Stipendio</th>
          <th scope="col">Ruolo</th>
          <th scope="col">Assunzione</th>
          <th scope="col" class="text-primary border-start border-primary fw-bold text-center bg-light">ID ACC</th>
          <th scope="col" class="account-header account-cell">Username </th>
          <th scope="col" class="account-header">Email</th>
          <th scope="col" class="account-header text-success">Permesso</th>
          <th scope="col">AZIONI</th>
    </tr>
  </thead>
  <tbody> 
    <tr th:each="d: ${items}">
    <td scope="row" th:text=${d.id}> </td>
     <td  th:text=${d.nome}> </td>
     <td  th:text=${d.cognome}> </td>
     <td th:text="${d.sesso}"></td>
      <td th:text=${d.cf}> </td>
      <td th:text="${d.dataDiNascita}"></td>
      <td th:if="${mostraEta}" class="fw-bold text-danger text-center">
      <span th:with="annoCorrente=${T(java.time.LocalDate).now().getYear()}, 
                   annoNascita=${d.dataDiNascita.getYear()}"
          th:text="${annoCorrente - annoNascita}">
      </span>
      </td>
      <td th:text="${d.stipendio}"></td>
      <td th:text="${d.tiporuolo}"></td>
      <td th:text="${d.dataDiAss}"></td>
      <td th:text="${d.idAccount}" class="text-primary border-start border-primary text-center fw-bold" ></td>
      <td th:text="${d.username}" class="fw-bold text-primary"></td>
      <td th:text="${d.email}" class="small"></td>
      <td>
    <span th:text="${d.tipopermesso}" 
      th:classappend="${d.tipopermesso.name() == 'ADMIN' ? 'badge bg-danger' : 'badge bg-info'}">
</span>
</td>
    <td>
    <div class="d-flex gap-2">
    <form th:action="@{|/${d.id}/delete|}" th:method="delete">
    <button class="btn btn-primary"  onclick="return confirm('sei sicuro di eliminare?')" type="submit" >ELIMINA</button>
    </form>
    <form th:action="@{/modifica}" method="get"> 
    <input type="hidden" name="id" th:value="${d.id}">
    <button class="btn btn-warning" type="submit">MODIFICA</button>
</form>
</div>
    </td>
    </tr>
  </tbody>
</table>
    
  <a href="/home" class="btn btn-outline-primary fw-bold shadow-sm">Home</a>
  <a th:href="@{/gestione}" class="btn btn-sm btn-outline-danger fw-bold shadow-sm">RESET FILTRI</a>
   
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
