<!doctype html>
<html lang="it" xmlns:th="http://www.thymeleaf.org"> <!--  import della libreria  -->
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
    <link rel="stylesheet" th:href="@{/style.css}">
    <title>Spring Step 01</title>
  </head>
  <body>
  
    <h1 th:text=" ${azione != null ? azione + ' dipendente' : 'Inserimento'} ">Inserimento</h1>
    
<form  th:method="${azione == 'Modifica' ? 'put' : 'post'}" 
      th:action="${azione == 'Modifica' ? '/modifica' : '/new'}" class="row g-3 needs-validation" novalidate th:object="${dipendente}">
 
 <input type="hidden" th:field="*{id}"> <!-- ID SALVATO NASCOSTO -->
  <input type="hidden" th:field="*{idAccount}">
  <input type="hidden" th:field="*{idPermesso}">
  <div class="col-md-4">
    <label for="validationCustom01" class="form-label">NOME</label>
    <input type="text"  id="validationCustom01" th:field="*{nome}" th:classappend="${#fields.hasErrors('nome')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')" th:class="form-control" >
    <span class="error-text" th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}" >
    </span>
  </div>
  
  <div class="col-md-4">
    <label for="validationCustom02" class="form-label">COGNOME</label>
    <input type="text"  id="validationCustom02" th:field="*{cognome}" th:classappend="${#fields.hasErrors('cognome')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')" th:class="form-control" >
    <span class="error-text" th:if="${#fields.hasErrors('cognome')}" th:errors="*{cognome}" >
    </span>
  </div>
  
  <div class="col-md-4">
            <label class="form-label d-block">SESSO</label>
            <div class="form-check form-check-inline mt-2">
                <input class="form-check-input" type="radio" th:field="*{sesso}" value="M" 
                       th:classappend="${#fields.hasErrors('sesso')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')" >
                <label class="form-check-label">M</label>
            </div>
            <div class="form-check form-check-inline">
                <input class="form-check-input" type="radio" th:field="*{sesso}" value="F" 
                       th:classappend="${#fields.hasErrors('sesso')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')" >
                <label class="form-check-label">F</label>
            </div>
            <div class="error-text" th:if="${#fields.hasErrors('sesso')}" th:errors="*{sesso}"></div>
        </div>
  
  <div class="col-md-4">
    <label for="validationCustom03" class="form-label">CODICE FISCALE</label>
    <input type="text" id="validationCustom03" th:field="*{cf}" th:classappend="${#fields.hasErrors('cf')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')" th:class="form-control" >
      <span class="error-text" th:if="${#fields.hasErrors('cf')}" th:errors="*{cf}" >
    </span>
  </div>
  <div class="col-md-4">
    <label for="validationCustom04" class="form-label">DATA DI NASCITA </label>
    <input type="date" th:field="*{dataDiNascita}"  th:classappend="${#fields.hasErrors('dataDiNascita')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')" th:class="form-control">
    <span class="error-text" th:if="${#fields.hasErrors('dataDiNascita')}" th:errors="*{dataDiNascita}"></span>
  </div>

  <div class="col-md-4">
    <label for="validationCustom05" class="form-label">STIPENDIO</label>
   <input type="number"  th:field="*{stipendio}" 
           th:classappend="${#fields.hasErrors('stipendio')} ? 'is-invalid' : (${dipendente.stipendio != null} ? 'is-valid' : '')" 
           class="form-control" placeholder="Inserisci importo">
    <span class="error-text" th:if="${#fields.hasErrors('stipendio')}" th:errors="*{stipendio}"></span>
  </div>

  <div class="col-md-4">
    <label for="validationCustom06" class="form-label">RUOLO</label>
    <select th:field="*{tiporuolo}" class="form-select" 
            th:classappend="${#fields.hasErrors('tiporuolo')} ? 'is-invalid' : (${dipendente.tiporuolo != null} ? 'is-valid' : '')">
        
        <option value="" th:selected="${dipendente.tiporuolo == null}">Scegli un ruolo...</option>
        
        <option th:each="r : ${T(com.example.springstep1.entities.Ruolo).values()}"  
                th:value="${r}" th:text="${r}"></option> <!-- PRENDE DIRETTAMENTE I VALORI DALLA CLASSE ENUM -->
    </select>
    <span class="error-text" th:if="${#fields.hasErrors('tiporuolo')}" th:errors="*{tiporuolo}"></span>
  </div>

  <div class="col-md-4">
    <label for="validationCustom07" class="form-label">DATA ASSUNZIONE</label>
    <input type="date" th:field="*{dataDiAss}" th:classappend="${#fields.hasErrors('dataDiAss')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')" class="form-control">
    <span class="error-text" th:if="${#fields.hasErrors('dataDiAss')}" th:errors="*{dataDiAss}"></span>
  </div>
  
  <div class="col-12 mt-4"><h5 class="fw-bold border-bottom text-warning">Credenziali Account</h5></div>

    <div class="col-md-4">
        <label class="form-label fw-bold">USERNAME</label>
        <input type="text" th:field="*{username}" class="form-control" th:classappend="${#fields.hasErrors('username')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')">
        <span class="text-danger fw-bold small" th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></span>
    </div>

    <div class="col-md-4">
        <label class="form-label fw-bold">EMAIL</label>
        <input type="email" th:field="*{email}" class="form-control" th:classappend="${#fields.hasErrors('email')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')">
        <span class="text-danger fw-bold small" th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></span>
    </div>

    <div class="col-md-4">
        <label class="form-label fw-bold">PASSWORD</label>
        <input type="password" th:field="*{passwr}" class="form-control" 
              
               th:classappend="${#fields.hasErrors('passwr')} ? 'is-invalid' : (${#fields.hasAnyErrors()} ? 'is-valid' : '')">
        <span class="text-danger fw-bold small" th:if="${#fields.hasErrors('passwr')}" th:errors="*{passwr}"></span>
    </div>
    
    <div class="col-md-4">
    <label for="validationCustom08" class="form-label fw-bold">TIPO PERMESSO</label>
    <select th:field="*{tipopermesso}" class="form-control form-select" 
            th:classappend="${#fields.hasErrors('tipopermesso')} ? 'is-invalid' : (${dipendente.tipopermesso != null} ? 'is-valid' : '')">
        
        <option value="" th:selected="${dipendente.tipopermesso == null}">Seleziona permesso...</option>
        
        <option th:each="p : ${T(com.example.springstep1.entities.Permesso).values()}"  
                th:value="${p}" th:text="${p}"></option>
    </select>
    <span class="text-danger fw-bold small" th:if="${#fields.hasErrors('tipopermesso')}" th:errors="*{tipopermesso}"></span>
</div>
  
  <div class="col-12">
    <button class="btn btn-primary" th:text="${testoBottone != null ? testoBottone : 'Registrati'}" type="submit">Submit</button>
  
   <a class="btn btn-outline-primary fw-bold shadow-sm"
       th:text="'Reset'"
       th:href="${azione == 'Modifica' ? '/modifica?id=' + dipendente.id : '/new'}">
       Reset
    </a>
    
 <a href="/home" class="btn btn-outline-primary fw-bold shadow-sm">
     Home
</a>
  </div>
</form>
   
   

    <!-- Optional JavaScript; choose one of the two! -->

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

    <!-- Option 2: Separate Popper and Bootstrap JS -->
    <!--
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.min.js" integrity="sha384-G/EV+4j2dNv+tEPo3++6LCgdCROaejBqfUeNjuKAiuXbjrxilcCdDz6ZAVfHWe1Y" crossorigin="anonymous"></script>
    -->
  </body>
</html>
